<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaanakAI — Procurement Intelligence</title>
    <meta name="description" content="AI-powered procurement standards intelligence workbench for Indian government procurement." />
    <!-- No-flash theme init: must run before React renders -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('maanakai-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || 'dark';
          if (theme === 'system') {
            theme = prefersDark ? 'dark' : 'light';
          }
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
