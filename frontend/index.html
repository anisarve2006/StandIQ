    <!-- Theme init: default to soothing warm mode -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('maanakai-theme');
          var theme = stored || 'soothing';
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'soothing';
          }
          document.documentElement.classList.remove('dark', 'light', 'soothing');
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.classList.add('soothing');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
