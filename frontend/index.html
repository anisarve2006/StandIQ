<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BISense — Standards Intelligence</title>
    <meta name="description" content="AI-powered procurement standards intelligence workbench for Indian government procurement specifications." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Theme init: default to soothing warm mode -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('maanakai-theme');
          var theme = stored || 'soothing';
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'soothing';
          }
          document.documentElement.classList.remove('dark', 'light', 'soothing');
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.classList.add('soothing');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
